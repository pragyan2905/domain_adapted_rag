services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6380:6379"
      - "8002:8001" # RedisInsight UI (optional, mapped to 8002 to avoid backend collision)
    environment:
      - REDIS_ARGS=--maxmemory 100mb --maxmemory-policy allkeys-lru --protected-mode no
    volumes:
      - ./redis_storage:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped
